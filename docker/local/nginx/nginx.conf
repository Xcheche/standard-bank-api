# Defines a group of backend servers (an "upstream") that nginx can proxy to.
# Here we point to a single API server running in the docker network.
upstream api{
    # This name must match the name used in docker-compose.yml for the API service
    # The backend API container is reachable at hostname "api" on port 8000.
    server api:8000;
}

# Custom log format that captures detailed request/response info for debugging and auditing.
# Includes the client IP, the authenticated Django user, request line, status, bytes sent,
# referer, user agent, request/upstream timing, and the original forwarded-for header.
log_format detailed_log '$remote_addr - $upstream_http_x_django_user - [$time_local] '
'"$request" $status $body_bytes_sent "$http_referer" '
'"$http_user_agent" "$request_time $upstream_response_time" '
'"$http_x_forwarded_for"';




# Virtual server block: defines how nginx handles incoming HTTP connections.
server{
    # Listen for plain HTTP traffic on port 80.
    listen 80;

    # Allow request bodies up to 20 megabytes (e.g. for uploads/large payloads).
    client_max_body_size 20M;

    # Write error-level messages to the specified error log file.
    error_log /var/log/nginx/error.log error;

    # Pass the original Host header through to the backend.
    proxy_set_header Host $host;

    # Forward the real client IP to the backend (useful behind a proxy).
    proxy_set_header X-Real-IP $remote_addr;

    # Append the client IP to the X-Forwarded-For chain for upstream apps.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Tell the backend what protocol (http/https) the client used.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass the Django user from the request header to the backend.
    proxy_set_header X-Django-User $http_x_django_user;
    
    location /api/ {
        # Proxy requests to the defined upstream group "api".
        proxy_pass http://api;

        # Use the custom log format for this location.
        access_log /var/log/api_access.log detailed_log;
        error_log /var/log/api_error.log error;
        
    }
    location /supersecret {
        # Proxy requests to the defined upstream group "api".
        proxy_pass http://api;

        # Use the custom log format for this location.
        access_log /var/log/nginx/admin_access.log detailed_log;
        error_log /var/log/api_error.log error;


    }

    location /static/ {
        # /app/staticfiles is mounted from the host via docker-compose volume
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Catch-all: proxy everything else to the Django app
    location / {
        proxy_pass http://api;
        access_log /var/log/nginx/api_access.log detailed_log;
        error_log /var/log/nginx/api_error.log error;
    }
}